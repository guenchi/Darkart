name: CI

on:
  push:
    branches:
      - master
      - dev
  pull_request:
    branches:
      - master
      - dev

jobs:
  linux:
    runs-on: ubuntu-24.04

    steps:
      # Check out into lib/darkart so the default load path ./lib/darkart/py.so resolves.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: lib/darkart

      - name: Install Chez Scheme, Python and NumPy
        run: |
          sudo apt-get update
          sudo apt-get install -y chezscheme python3-dev python3-numpy

      - name: Build py.so
        working-directory: lib/darkart/c
        run: cc -Wall -Werror -fPIC -shared $(python3-config --includes) -o ../py.so py.c $(python3-config --ldflags --embed)

      - name: Test
        run: scheme --libdirs lib --libexts .sc --script lib/darkart/test/test-pycall.sc
